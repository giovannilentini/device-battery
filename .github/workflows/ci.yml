name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Fedora (ASan + UBSan)
            image: fedora:latest
            sanitizers: "address;undefined"
            cxxflags: ""
          - name: Arch Linux
            image: archlinux:latest
            sanitizers: ""
            cxxflags: ""
          # The oldest Qt the README promises to build with that a current distribution
          # ships (6.8): Fedora and Arch only compile the code paths for the newest Qt.
          - name: Debian 13
            image: debian:trixie
            sanitizers: ""
            # Qt's QML targets add the directories of the private headers, which Debian
            # packages separately and the widget does not use: with only the packages the
            # README lists they are missing, which must stay a warning.
            cxxflags: "-Wno-error=missing-include-dirs"

    steps:
      - name: Install dependencies (Fedora)
        if: startsWith(matrix.image, 'fedora')
        run: >
          dnf install -y --setopt=install_weak_deps=False
          git cmake ninja-build gcc-c++ extra-cmake-modules
          qt6-qtbase-devel qt6-qtdeclarative-devel bluez-libs-devel
          libasan libubsan dbus-daemon

      - name: Install dependencies (Arch Linux)
        if: startsWith(matrix.image, 'archlinux')
        run: >
          pacman -Syu --noconfirm --needed
          git cmake ninja gcc extra-cmake-modules qt6-base qt6-declarative bluez-libs dbus

      # The packages the README lists for Debian, plus Ninja and dbus-run-session for the tests.
      - name: Install dependencies (Debian)
        if: startsWith(matrix.image, 'debian')
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y \
            git cmake ninja-build g++ extra-cmake-modules \
            qt6-base-dev qt6-declarative-dev libbluetooth-dev dbus-daemon

      - uses: actions/checkout@v5

      - name: Configure
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          -DECM_ENABLE_SANITIZERS="${{ matrix.sanitizers }}"
          -DCMAKE_CXX_FLAGS="${{ matrix.cxxflags }}"

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          # Qt's own global state shows up as leaks at exit; UB must fail the test.
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure

  format:
    name: clang-format
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install dependencies
        run: >
          dnf install -y --setopt=install_weak_deps=False
          git cmake ninja-build gcc-c++ extra-cmake-modules
          qt6-qtbase-devel qt6-qtdeclarative-devel bluez-libs-devel python3

      # Pinned: other clang-format versions wrap some lines differently.
      - name: Install clang-format
        run: |
          python3 -m venv /opt/clang-format
          /opt/clang-format/bin/pip install clang-format==23.1.3

      - uses: actions/checkout@v5

      - name: Check formatting
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cmake -B build -G Ninja -DBUILD_TESTING=OFF -DKDE_CLANG_FORMAT_EXECUTABLE=/opt/clang-format/bin/clang-format
          cmake --build build --target clang-format
          git diff --exit-code || { echo "::error::Run 'cmake --build build --target clang-format' and commit the result."; exit 1; }

  # The translation template must match the texts in the QML, or translators work on old ones.
  translations:
    name: Translation template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gettext

      - name: Check that the template is up to date
        run: scripts/extract-messages.sh --check || { echo "::error::Run scripts/extract-messages.sh and commit the result."; exit 1; }

  qmllint:
    name: qmllint
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      # The QML modules the widget imports, so qmllint can check every type and property.
      - name: Install dependencies
        run: >
          dnf install -y --setopt=install_weak_deps=False
          git cmake ninja-build gcc-c++ extra-cmake-modules
          qt6-qtbase-devel qt6-qtdeclarative-devel bluez-libs-devel
          libplasma kf6-kirigami kf6-kcmutils

      - uses: actions/checkout@v5

      # Builds the plugin so qmllint also knows DeviceModel. qmllint exits 0 on warnings by
      # default, hence --max-warnings 0. Plasma injects i18nc() at runtime, which qmllint
      # cannot see, so unqualified accesses are reported without failing the job.
      - name: Lint QML
        run: |
          cmake -B build -G Ninja -DBUILD_TESTING=OFF
          cmake --build build
          /usr/lib64/qt6/bin/qmllint --max-warnings 0 --unqualified info -I build/bin package/contents/ui/*.qml
